version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  assignment-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m src.workers.assignment_worker
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
