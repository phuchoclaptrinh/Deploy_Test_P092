[pytest]
markers =
    postgres_e2e: v4 end-to-end flow against a disposable PostgreSQL database.
        Skipped unless V4_E2E_DATABASE_URL is set; see docs/v4_operations.md §8.
        Never point it at a shared or Supabase database - these tests truncate.

# Collect from the source tree only.
#
# `outputs/` is gitignored scratch -- eval artefacts, migration rehearsal
# working directories -- and pytest does not read .gitignore, so it walks in
# anyway. A rehearsal that unpacks a Linux postgresql-client there leaves
# symlinks Windows cannot open, and collection dies with WinError 1920 before a
# single test runs. Nothing under these directories is ever a test.
norecursedirs =
    outputs
    .venv
    node_modules
    frontend
    .git
    __pycache__
    *.egg-info

testpaths = tests
